[project]
name = "english-ls"
version = "0.1.0"
description = "Language server that highlights the grammatical structure of English prose"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pygls>=1.3,<2",
    "lsprotocol>=2023.0.1",
    "spacy>=3.7,<4",
    "markdown-it-py>=3.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
# Most accurate parser. Needs PyTorch (~1 GB download).
trf = [
    "spacy[transformers]>=3.7,<4",
    "en-core-web-trf @ https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl",
]
# Better than sm, no PyTorch needed.
lg = [
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[project.scripts]
english-ls = "english_ls.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/english_ls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
